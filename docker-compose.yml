services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: choyon_nexus
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    env_file:
      - apps/server/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/choyon_nexus
      CLIENT_URL: http://localhost:8080
      COOKIE_SECURE: "false"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - uploads_data:/app/apps/server/uploads
    ports:
      - "5000:5000"

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  mongo_data:
  uploads_data:
